<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahjong">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* same base the artifact host provides */
html { box-sizing: border-box; overflow: hidden; background: #072a1f;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Jade Mahjong</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a3a2b">
<style>
/* Layout: one-screen phone app. Status strip on top, tile stack fills the middle, pace bar under it, four thumb buttons at the bottom. */
:root {
  --felt-hi: #14694d;
  --felt-lo: #072a1f;
  --ivory: #fffdf4;
  --ivory-shade: #ece5cf;
  --bone: #d6cdb0;
  --jade: #1f9163;
  --jade-deep: #0f5c3d;
  --ink: #f3efe2;
  --ink-dim: #a9c4b6;
  --gold: #ffc83d;
  --amber: #ffb054;
  --panel: rgba(4, 28, 20, .62);
  --line: rgba(243, 239, 226, .18);
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 90% at 50% 35%, var(--felt-hi), var(--felt-lo)) var(--felt-lo);
  color: var(--ink);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 600 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.stats .key b { color: var(--gold); font-size: 15px; }
#msg { min-height: 18px; margin: 0; font-size: 13px; text-align: center; color: var(--amber); }

#wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#board { position: relative; --d: calc(var(--u) * .045); }

.tile {
  position: absolute;
  width: var(--u); height: calc(var(--u) * 1.3);
  left: calc(var(--u) * var(--tx)); top: calc(var(--u) * var(--ty));
  border-radius: calc(var(--u) * .13);
  background: linear-gradient(155deg, var(--ivory) 55%, var(--ivory-shade));
  box-shadow:
    inset 0 0 0 1px rgba(120, 105, 60, .28),
    calc(var(--d) * -1) var(--d) 0 var(--bone),
    calc(var(--d) * -2) calc(var(--d) * 2) 0 var(--jade),
    calc(var(--d) * -2.6) calc(var(--d) * 2.6) 0 var(--jade-deep),
    calc(var(--d) * -4) calc(var(--d) * 4) calc(var(--d) * 3) rgba(0, 0, 0, .45);
  cursor: pointer;
  transition: opacity .2s, transform .2s, background .12s;
}
.tile svg { display: block; width: 100%; height: 100%; pointer-events: none; }
.tile.sel {
  background: linear-gradient(155deg, #fff6c9, #ffe58a);
  outline: calc(var(--u) * .055) solid var(--gold);
  outline-offset: calc(var(--u) * -.02);
  transform: translate(calc(var(--d) * .8), calc(var(--d) * -.8));
}
.tile.hint { animation: hint 0.7s ease-in-out 3; outline: calc(var(--u) * .055) solid #7fe6ff; outline-offset: calc(var(--u) * -.02); }
.tile.nope { animation: nope .28s; }
.tile.gone { opacity: 0; transform: scale(.82); pointer-events: none; }
@keyframes hint { 50% { background: #d6f6ff; } }
@keyframes nope { 25% { transform: translateX(-4%); } 75% { transform: translateX(4%); } }

/* pace bar: one notch per match, marker right of centre = ahead of the last clear */
#pace { align-self: center; width: 100%; max-width: 100%; display: flex; flex-direction: column; gap: 5px; }
.pace-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.pace-row b { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; text-align: center; }
#track {
  position: relative; height: 20px;
  border: 1px solid var(--line); border-radius: 7px;
  background: linear-gradient(90deg, rgba(184, 50, 42, .42), rgba(4, 28, 20, .6) 50%, rgba(31, 145, 99, .6));
}
#track i { position: absolute; bottom: 0; width: 1px; height: 7px; margin-left: -.5px; background: rgba(243, 239, 226, .5); }
#track i.mid { height: 100%; width: 2px; margin-left: -1px; background: rgba(243, 239, 226, .8); }
#marker {
  position: absolute; top: -4px; bottom: -4px; left: 50%; width: 12px; margin-left: -6px;
  border-radius: 4px;
  background: linear-gradient(155deg, var(--ivory), var(--gold));
  box-shadow: 0 1px 5px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(120, 90, 20, .5);
  transition: left .35s ease-out;
}
#pace.idle #marker { opacity: .4; }

footer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button {
  min-height: 46px; padding: 0 4px; white-space: nowrap;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--ink);
  font: 600 13px var(--ui);
  cursor: pointer;
}
button:active { background: rgba(4, 28, 20, .85); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.call { border-color: var(--amber); color: var(--amber); }

#sheet {
  position: fixed; inset: 0; z-index: 99999;
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(2, 16, 11, .74);
}
.card {
  width: min(380px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 20px 16px 14px;
  display: flex; flex-direction: column; gap: 10px;
  border: 1px solid var(--line); border-radius: 18px;
  background: #0c3b2c;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
}
.card h2 { margin: 0; font: 600 22px/1.2 var(--display); text-wrap: balance; }
.card p { margin: 0 0 2px; font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
.card button { flex: none; }
.card .wide { min-height: 50px; font-size: 16px; }
.card .quiet { background: none; border-color: transparent; color: var(--ink-dim); min-height: 40px; font-size: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lay { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 64px; text-align: left; }
.lay svg { flex: none; width: 33px; height: 44px; }
.lay span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lay b { font-size: 14px; }
.lay small { font-weight: 400; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.lay small.best { color: var(--gold); }
.lay.cur { border-color: var(--gold); }
.scores { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums; }
.scores li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 4px; border-top: 1px solid var(--line); color: var(--ink-dim); }
.scores li b { color: var(--ink); }
.scores li.me, .scores li.me b { color: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  .tile, #marker { transition: none; }
  .tile.hint, .tile.nope { animation: none; }
}
</style>
</head>
<body>
<header>
  <h1>Jade Mahjong</h1>
  <div class="stats">
    <span><b id="sTiles">0</b> tiles</span>
    <span class="key"><b id="sMoves">0</b> matches open</span>
    <span><b id="sTime">0:00</b></span>
  </div>
</header>
<p id="msg" role="status"></p>
<div id="wrap"><div id="board"></div></div>
<div id="pace">
  <div class="pace-row"><span>Slower</span><b id="paceTxt"></b><span>Faster</span></div>
  <div id="track"><div id="marker"></div></div>
</div>
<footer>
  <button id="bUndo" type="button">Undo</button>
  <button id="bHint" type="button">Hint</button>
  <button id="bShuffle" type="button">Shuffle</button>
  <button id="bNew" type="button">New</button>
</footer>
<div id="sheet" hidden><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const board = $('board'), wrap = $('wrap'), sheet = $('sheet'), card = $('card'), msg = $('msg');

/* ---------- layouts: one array of [x0, y0, cols, rows] blocks per layer, in half-tile units ---------- */
const BASE = [0, 0, 6, 8];
const DIAMOND = [[4,0,2,8],[2,2,1,6],[8,2,1,6],[0,4,1,4],[10,4,1,4]];
const GLASS = [[4,0,2,8],[2,0,1,3],[8,0,1,3],[2,10,1,3],[8,10,1,3],[0,0,1,2],[10,0,1,2],[0,12,1,2],[10,12,1,2]];
const PIERS = [[0,0,2,8],[8,0,2,8]];
const STRIPS = [[0,0,2,8],[8,0,2,8],[5,0,1,8]];
const WALLS = [[0,0,6,1],[0,14,6,1],[0,2,1,6],[10,2,1,6]];
const BLOCKS = [[0,0,2,3],[8,0,2,3],[0,10,2,3],[8,10,2,3],[4,6,2,2]];
const LAYOUTS = {
  steps:     { name: 'Steps',        layers: [[BASE], [[2,2,4,6]], [[4,4,2,4]], [[4,6,2,2]]] },
  cross:     { name: 'Cross',        layers: [[[2,0,4,8],[0,4,1,4],[10,4,1,4]], [[2,2,4,6]], [[4,2,2,6],[2,6,1,2],[8,6,1,2]], [[4,4,2,4]], [[4,6,2,2]]] },
  diamond:   { name: 'Diamond',      layers: [DIAMOND, DIAMOND, [[4,2,2,6],[2,4,1,4],[8,4,1,4]], [[4,4,2,4]], [[4,6,2,2]]] },
  stairs:    { name: 'Stairs',       layers: [[BASE], [[0,0,4,8]], [[0,0,2,8]], [[0,0,1,8]]] },
  hourglass: { name: 'Hourglass',    layers: [GLASS, GLASS, [[2,0,4,2],[2,12,4,2],[4,4,2,4]], [[4,1,2,1],[4,13,2,1],[4,6,2,2]]] },
  fortress:  { name: 'Fortress',     layers: [[BASE], [...WALLS, [4,6,2,2]], WALLS, [[0,0,1,1],[10,0,1,1],[0,14,1,1],[10,14,1,1]]] },
  corners:   { name: 'Four Corners', layers: [[BASE], BLOCKS, BLOCKS, [[0,2,2,1],[8,2,2,1],[0,12,2,1],[8,12,2,1]]] },
  keep:      { name: 'Keep',         layers: [[BASE], [[0,2,6,6]], [[2,2,4,6]], [[4,4,2,4]], [[4,6,2,2]]] },
  twins:     { name: 'Twin Peaks',   layers: [[BASE], [[0,0,6,3],[0,10,6,3]], [[2,0,4,3],[2,10,4,3]], [[4,0,2,3],[4,10,2,3]], [[4,2,2,1],[4,12,2,1]]] },
  gate:      { name: 'Gate',         layers: [[BASE], PIERS, PIERS, [[0,2,2,6],[8,2,2,6]]] },
  columns:   { name: 'Columns',      layers: [STRIPS, STRIPS, STRIPS, [[1,2,1,6],[9,2,1,6],[5,4,1,4]]] },
  tower:     { name: 'Tower',        layers: [[BASE], [[0,2,6,6]], [[0,2,6,6]], [[2,4,4,4]], [[4,4,2,4]]] },
};
const LIFT = 0.09, EDGE = 0.2, HINTS = 2, SHUFFLES = 2, SPAN = 12;

function positions(key) {
  const out = [];
  LAYOUTS[key].layers.forEach((blocks, z) => {
    for (const [x0, y0, cols, rows] of blocks)
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out.push({ x: x0 + c * 2, y: y0 + r * 2, z });
  });
  return out;
}
function neighbours(pos) {
  return pos.map(p => {
    const above = [], left = [], right = [];
    pos.forEach((q, j) => {
      if (q === p || Math.abs(q.y - p.y) >= 2) return;
      if (q.z === p.z + 1 && Math.abs(q.x - p.x) < 2) above.push(j);
      else if (q.z === p.z && q.x === p.x - 2) left.push(j);
      else if (q.z === p.z && q.x === p.x + 2) right.push(j);
    });
    return { above, left, right };
  });
}
const isFree = (i, alive, nb) => {
  const on = j => alive[j];
  return alive[i] && !nb[i].above.some(on) && (!nb[i].left.some(on) || !nb[i].right.some(on));
};

/* ---------- tile set ---------- */
const QUADS = [];
for (const s of 'cdb') for (let n = 1; n <= 9; n++) QUADS.push(Array(4).fill(s + n));
for (let n = 1; n <= 4; n++) QUADS.push(Array(4).fill('w' + n));
for (let n = 1; n <= 3; n++) QUADS.push(Array(4).fill('g' + n));
QUADS.push(['f1', 'f2', 'f3', 'f4'], ['s1', 's2', 's3', 's4']);
const matchKey = id => (id[0] === 'f' || id[0] === 's') ? id[0] : id;

const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function freshPairs(nTiles) {
  const pairs = [];
  for (const q of shuffled(QUADS).slice(0, nTiles / 4)) { const s = shuffled(q); pairs.push([s[0], s[1]], [s[2], s[3]]); }
  return shuffled(pairs);
}
/* Deal by playing the game backwards: keep taking two free tiles and giving them a matching pair, so a winning order always exists. */
function deal(alive0, nb, pairs) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const alive = alive0.slice(), faces = {};
    let left = alive.filter(Boolean).length, p = 0, ok = true;
    while (left) {
      const free = [];
      for (let i = 0; i < alive.length; i++) if (isFree(i, alive, nb)) free.push(i);
      if (free.length < 2) { ok = false; break; }
      const a = free.splice(Math.random() * free.length | 0, 1)[0];
      const b = free[Math.random() * free.length | 0];
      faces[a] = pairs[p][0]; faces[b] = pairs[p][1]; p++;
      alive[a] = alive[b] = false; left -= 2;
    }
    if (ok) return faces;
  }
  return null;
}

/* ---------- tile faces (drawn, 100 x 130) ---------- */
const NAVY = '#1d3f7a', RED = '#b8322a', GREEN = '#1c7a4c', INKY = '#1b2430', PLUM = '#8a2c86', RUST = '#b25e12', FAINT = '#8c8672';
const CJK = `font-family="'Kaiti SC','STKaiti','KaiTi','Songti SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',serif" font-weight="700"`;
const glyph = (s, x, y, size, fill) => `<text x="${x}" y="${y}" dy=".36em" font-size="${size}" fill="${fill}" text-anchor="middle" ${CJK}>${s}</text>`;
const index = (s, fill = FAINT, x = 86, y = 15) => `<text x="${x}" y="${y}" dy=".36em" font-size="15" fill="${fill}" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700">${s}</text>`;
const dot = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r * .62}" fill="#fffdf4"/><circle cx="${x}" cy="${y}" r="${r * .32}" fill="${c}"/>`;
const stick = (x, y, h, c) => `<rect x="${x - 5.5}" y="${y - h / 2}" width="11" height="${h}" rx="5.5" fill="${c}"/><rect x="${x - 5.5}" y="${y - 1.5}" width="11" height="3" fill="#fffdf4" opacity=".75"/>`;
const NUM = '一二三四五六七八九';
const DOTS = {
  1: [[50, 65, 32, GREEN]],
  2: [[50, 36, 18, GREEN], [50, 94, 18, NAVY]],
  3: [[26, 28, 15, NAVY], [50, 65, 15, RED], [74, 102, 15, GREEN]],
  4: [[30, 38, 16, NAVY], [70, 38, 16, GREEN], [30, 92, 16, GREEN], [70, 92, 16, NAVY]],
  5: [[28, 30, 14, NAVY], [72, 30, 14, GREEN], [50, 65, 14, RED], [28, 100, 14, GREEN], [72, 100, 14, NAVY]],
  6: [[30, 26, 14, GREEN], [70, 26, 14, GREEN], [30, 66, 14, RED], [70, 66, 14, RED], [30, 104, 14, RED], [70, 104, 14, RED]],
  7: [[24, 18, 10, GREEN], [50, 30, 10, GREEN], [76, 42, 10, GREEN], [30, 76, 13, RED], [70, 76, 13, RED], [30, 108, 13, RED], [70, 108, 13, RED]],
  8: [[30, 20, 12, NAVY], [70, 20, 12, NAVY], [30, 50, 12, NAVY], [70, 50, 12, NAVY], [30, 80, 12, NAVY], [70, 80, 12, NAVY], [30, 110, 12, NAVY], [70, 110, 12, NAVY]],
  9: [[22, 26, 12, GREEN], [50, 26, 12, GREEN], [78, 26, 12, GREEN], [22, 65, 12, RED], [50, 65, 12, RED], [78, 65, 12, RED], [22, 104, 12, NAVY], [50, 104, 12, NAVY], [78, 104, 12, NAVY]],
};
const BAMS = {
  2: [[50, 36, 44, GREEN], [50, 94, 44, NAVY]],
  3: [[50, 36, 44, GREEN], [30, 94, 44, NAVY], [70, 94, 44, NAVY]],
  4: [[30, 36, 44, GREEN], [70, 36, 44, NAVY], [30, 94, 44, NAVY], [70, 94, 44, GREEN]],
  5: [[26, 36, 44, GREEN], [74, 36, 44, NAVY], [50, 65, 44, RED], [26, 94, 44, NAVY], [74, 94, 44, GREEN]],
  6: [[25, 36, 44, GREEN], [50, 36, 44, GREEN], [75, 36, 44, GREEN], [25, 94, 44, NAVY], [50, 94, 44, NAVY], [75, 94, 44, NAVY]],
  7: [[50, 23, 32, RED], [25, 65, 32, GREEN], [50, 65, 32, GREEN], [75, 65, 32, GREEN], [25, 107, 32, GREEN], [50, 107, 32, GREEN], [75, 107, 32, GREEN]],
  8: [[20, 36, 44, GREEN], [40, 36, 44, GREEN], [60, 36, 44, GREEN], [80, 36, 44, GREEN], [20, 94, 44, NAVY], [40, 94, 44, NAVY], [60, 94, 44, NAVY], [80, 94, 44, NAVY]],
  9: [[25, 23, 32, RED], [50, 23, 32, RED], [75, 23, 32, RED], [25, 65, 32, NAVY], [50, 65, 32, NAVY], [75, 65, 32, NAVY], [25, 107, 32, GREEN], [50, 107, 32, GREEN], [75, 107, 32, GREEN]],
};
function faceSVG(id) {
  const s = id[0], n = +id.slice(1);
  if (s === 'c') return glyph(NUM[n - 1], 46, 38, 50, NAVY) + glyph('萬', 50, 94, 50, RED) + index(n);
  if (s === 'd') return DOTS[n].map(a => dot(...a)).join('');
  if (s === 'b') {
    if (n === 1) return `<rect x="38" y="20" width="24" height="90" rx="12" fill="${GREEN}"/><rect x="38" y="46" width="24" height="4" fill="#fffdf4" opacity=".8"/><rect x="38" y="80" width="24" height="4" fill="#fffdf4" opacity=".8"/><circle cx="50" cy="65" r="7" fill="${RED}"/>`;
    return BAMS[n].map(a => stick(...a)).join('');
  }
  if (s === 'w') return glyph('東南西北'[n - 1], 50, 68, 74, INKY) + index('ESWN'[n - 1]);
  if (s === 'g') {
    if (n === 1) return glyph('中', 50, 66, 80, RED);
    if (n === 2) return glyph('發', 50, 66, 76, GREEN);
    return `<rect x="21" y="25" width="58" height="80" rx="7" fill="none" stroke="${NAVY}" stroke-width="6"/><rect x="32" y="36" width="36" height="58" rx="3" fill="none" stroke="${NAVY}" stroke-width="2.5"/>`;
  }
  const c = s === 'f' ? PLUM : RUST, g = (s === 'f' ? '梅蘭菊竹' : '春夏秋冬')[n - 1];
  return `<rect x="8" y="8" width="84" height="114" rx="9" fill="none" stroke="${c}" stroke-width="2.5" ${s === 's' ? 'stroke-dasharray="7 4"' : ''}/>` + glyph(g, 50, 70, 60, c) + index(n, c, 22, 22);
}
const NAMES = { c: 'character', d: 'dot', b: 'bamboo', w: 'wind', g: 'dragon', f: 'flower', s: 'season' };
function thumb(key) {
  const shade = ['#1c7a56', '#3fa57c', '#7fcba6', '#c4e8d2', '#fffdf4'];
  return `<svg viewBox="0 0 12.6 16.6" aria-hidden="true">${positions(key).map(p =>
    `<rect x="${p.x + .3}" y="${p.y + .3}" width="2" height="2" rx=".35" fill="${shade[p.z]}" stroke="#072a1f" stroke-width=".22"/>`).join('')}</svg>`;
}

/* ---------- saved data (kept in this browser's storage on the device) ---------- */
const SAVE_KEY = 'jade-mahjong-v1', REC_KEY = 'jade-mahjong-records-v1';
let REC = {};
function loadRec() { try { const r = JSON.parse(localStorage.getItem(REC_KEY)); if (r && typeof r === 'object') REC = r; } catch (e) {} }
function saveRec() { try { localStorage.setItem(REC_KEY, JSON.stringify(REC)); } catch (e) {} }
const bestOf = key => (REC[key] && REC[key].best) || [];

/* ---------- game state ---------- */
let G = null, pos = [], nb = [], els = [], sel = -1, hintTimer = 0;

function serialize() {
  return { v: 1, layout: G.layout, faces: G.faces, alive: G.alive.map(a => a ? 1 : 0).join(''), hist: G.hist, elapsed: G.elapsed,
           times: G.times, hints: G.hints, shuffles: G.shuffles, scored: G.scored, rec: REC };
}
function save() { try { const s = serialize(); delete s.rec; localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }
function restore(s) {
  if (!s || s.v !== 1 || !LAYOUTS[s.layout]) return false;
  const p = positions(s.layout);
  if (!Array.isArray(s.faces) || s.faces.length !== p.length || typeof s.alive !== 'string' || s.alive.length !== p.length) return false;
  G = { layout: s.layout, faces: s.faces, alive: [...s.alive].map(c => c === '1'), hist: Array.isArray(s.hist) ? s.hist : [], elapsed: +s.elapsed || 0,
        times: Array.isArray(s.times) ? s.times : [], hints: +s.hints || 0, shuffles: +s.shuffles || 0, scored: !!s.scored };
  build();
  return true;
}
function newGame(layout) {
  const p = positions(layout), n = neighbours(p), alive = p.map(() => true);
  const dealt = deal(alive, n, freshPairs(p.length));
  G = { layout, faces: p.map((_, i) => dealt[i]), alive, hist: [], elapsed: 0, times: [], hints: 0, shuffles: 0, scored: false };
  build(); save();
}

function build() {
  pos = positions(G.layout); nb = neighbours(pos); sel = -1;
  const zMax = Math.max(...pos.map(p => p.z));
  board.textContent = '';
  els = pos.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'tile' + (G.alive[i] ? '' : ' gone');
    el.dataset.i = i;
    el.style.setProperty('--tx', (p.x / 2 + p.z * LIFT + EDGE).toFixed(3));
    el.style.setProperty('--ty', (p.y / 2 * 1.3 + (zMax - p.z) * LIFT).toFixed(3));
    el.style.zIndex = p.z * 1000 + p.y * 20 + (30 - p.x);
    board.appendChild(el);
    return el;
  });
  board.dataset.w = Math.max(...pos.map(p => p.x)) / 2 + 1 + zMax * LIFT + EDGE;
  board.dataset.h = (Math.max(...pos.map(p => p.y)) / 2 + 1) * 1.3 + zMax * LIFT + EDGE;
  paintFaces(); fit(); status();
}
function paintFaces() {
  els.forEach((el, i) => {
    const id = G.faces[i];
    el.innerHTML = `<svg viewBox="0 0 100 130" aria-hidden="true">${faceSVG(id)}</svg>`;
    el.setAttribute('aria-label', NAMES[id[0]] + ' ' + id.slice(1));
  });
}
function fit() {
  const w = +board.dataset.w, h = +board.dataset.h;
  if (!w || !wrap.clientWidth) return;
  const u = Math.max(20, Math.min(wrap.clientWidth / w, wrap.clientHeight / h, 92));
  board.style.setProperty('--u', u.toFixed(2) + 'px');
  board.style.width = (u * w).toFixed(1) + 'px';
  board.style.height = (u * h).toFixed(1) + 'px';
  $('pace').style.width = (u * w).toFixed(1) + 'px';
}

const free = i => isFree(i, G.alive, nb);
const tilesLeft = () => G.alive.filter(Boolean).length;
function findPair() {
  const seen = {};
  for (let i = 0; i < pos.length; i++) {
    if (!free(i)) continue;
    const k = matchKey(G.faces[i]);
    if (k in seen) return [seen[k], i];
    seen[k] = i;
  }
  return null;
}
function countMoves() {
  const c = {};
  for (let i = 0; i < pos.length; i++) if (free(i)) { const k = matchKey(G.faces[i]); c[k] = (c[k] || 0) + 1; }
  return Object.values(c).reduce((s, n) => s + (n >> 1), 0);
}
const fmt = t => (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0');

/* Pace: my matches so far minus the matches my last clear of this layout had made by the same moment. */
const notchAt = k => 4 + (k + SPAN) * 92 / (SPAN * 2);
function pace() {
  const ghost = REC[G.layout] && REC[G.layout].last;
  const made = (pos.length - tilesLeft()) / 2;
  let d = 0, text;
  if (G.scored) text = 'Cleared';
  else if (!ghost) text = 'First clear here sets your pace';
  else {
    d = made - ghost.filter(t => t <= G.elapsed).length;
    text = d === 0 ? 'On pace' : d > 0 ? d + ' ahead' : -d + ' behind';
  }
  $('pace').classList.toggle('idle', !ghost || G.scored);
  $('paceTxt').textContent = text;
  $('marker').style.left = notchAt(Math.max(-SPAN, Math.min(SPAN, d))) + '%';
}

function status() {
  const left = tilesLeft(), moves = countMoves();
  const hintsLeft = HINTS - G.hints, shufflesLeft = SHUFFLES - G.shuffles;
  $('sTiles').textContent = left;
  $('sMoves').textContent = moves;
  $('sTime').textContent = fmt(G.elapsed);
  $('bUndo').disabled = !G.hist.length;
  $('bHint').textContent = 'Hint · ' + hintsLeft;
  $('bHint').disabled = !moves || hintsLeft <= 0;
  $('bShuffle').textContent = 'Shuffle · ' + shufflesLeft;
  $('bShuffle').disabled = left < 4 || shufflesLeft <= 0;
  const stuck = left > 0 && !moves, canShuffle = !$('bShuffle').disabled;
  $('bShuffle').classList.toggle('call', stuck && canShuffle);
  msg.textContent = !stuck ? '' : canShuffle ? 'No matches open. Shuffle or undo.' : G.hist.length ? 'No matches open and no shuffles left. Undo to try another path.' : 'No matches open and no shuffles left. Start a new game.';
  pace();
  if (!left) win();
}
function clearMarks() {
  clearTimeout(hintTimer);
  els.forEach(e => e.classList.remove('hint'));
}
function select(i) {
  if (sel >= 0) els[sel].classList.remove('sel');
  sel = i;
  if (i >= 0) els[i].classList.add('sel');
}
function tap(i) {
  clearMarks();
  if (!G.alive[i]) return;
  if (!free(i)) {
    const el = els[i];
    el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
    return;
  }
  if (sel === i) return select(-1);
  if (sel >= 0 && matchKey(G.faces[sel]) === matchKey(G.faces[i])) {
    const a = sel; select(-1);
    G.alive[a] = G.alive[i] = false;
    els[a].classList.add('gone'); els[i].classList.add('gone');
    G.hist.push([a, i]); G.times.push(G.elapsed);
    status(); save();
    return;
  }
  select(i);
}
function undo() {
  clearMarks(); select(-1);
  const last = G.hist.pop();
  if (!last) return;
  G.times.pop();
  for (const i of last) { G.alive[i] = true; els[i].classList.remove('gone'); }
  status(); save();
}
function hint() {
  clearMarks(); select(-1);
  const p = findPair();
  if (!p || G.hints >= HINTS) return;
  G.hints++;
  for (const i of p) { els[i].classList.remove('hint'); void els[i].offsetWidth; els[i].classList.add('hint'); }
  hintTimer = setTimeout(clearMarks, 2200);
  status(); save();
}
function shuffle() {
  clearMarks(); select(-1);
  if (G.shuffles >= SHUFFLES) return;
  const byKey = {};
  G.faces.forEach((f, i) => { if (G.alive[i]) (byKey[matchKey(f)] ||= []).push(f); });
  const pairs = [];
  for (const list of Object.values(byKey)) { const s = shuffled(list); for (let k = 0; k + 1 < s.length; k += 2) pairs.push([s[k], s[k + 1]]); }
  const dealt = deal(G.alive, nb, shuffled(pairs));
  if (!dealt) { msg.textContent = 'These tiles cannot be cleared from here. Undo a few moves.'; return; }
  for (const i in dealt) G.faces[i] = dealt[i];
  G.shuffles++; G.hist = [];
  paintFaces(); status(); save();
}

/* ---------- sheets ---------- */
function openSheet(html) { card.innerHTML = html; sheet.hidden = false; card.scrollTop = 0; }
function closeSheet() { sheet.hidden = true; }
function askNew() {
  const cells = Object.entries(LAYOUTS).map(([k, l]) => {
    const best = bestOf(k)[0];
    return `<button type="button" class="lay${G && G.layout === k ? ' cur' : ''}" data-layout="${k}">${thumb(k)}<span><b>${l.name}</b><small>${positions(k).length} tiles</small>${best ? `<small class="best">Best ${fmt(best.t)}</small>` : ''}</span></button>`;
  }).join('');
  openSheet(`<h2>Choose a layout</h2><p>Every deal can be cleared. Each board allows ${HINTS} hints and ${SHUFFLES} shuffles.</p><div class="grid">${cells}</div><button type="button" class="quiet" data-close>Keep playing</button>`);
}
function win() {
  const name = LAYOUTS[G.layout].name;
  if (!G.scored) {
    G.scored = true;
    const r = REC[G.layout] ||= { best: [], last: null };
    if (G.times.length === pos.length / 2) r.last = G.times.slice();
    r.best.push({ t: G.elapsed, d: Date.now() });
    r.best.sort((a, b) => a.t - b.t || b.d - a.d);
    r.best = r.best.slice(0, 5);
    saveRec(); save(); pace();
  }
  const best = bestOf(G.layout), mine = best.findIndex(b => b.t === G.elapsed);
  const line = mine === 0 ? (best.length > 1 ? `New best time on ${name}.` : `First clear on ${name}. That is the time to beat.`)
             : mine > 0 ? `Number ${mine + 1} on your ${name} list.` : `Your best on ${name} is ${fmt(best[0].t)}.`;
  const rows = best.map((b, i) => `<li${i === mine ? ' class="me"' : ''}><span>${i + 1}. <b>${fmt(b.t)}</b></span><span>${new Date(b.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span></li>`).join('');
  openSheet(`<h2>Cleared in ${fmt(G.elapsed)}</h2><p>${line}</p><ol class="scores">${rows}</ol><button type="button" class="wide" data-layout="${G.layout}">Play ${name} again</button><button type="button" class="wide" data-pick>Choose a layout</button>`);
}
card.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if ('pick' in b.dataset) return askNew();
  if (b.dataset.layout) newGame(b.dataset.layout);
  closeSheet();
});

/* ---------- wiring ---------- */
for (let k = -SPAN; k <= SPAN; k++) {
  const n = document.createElement('i');
  if (!k) n.className = 'mid';
  n.style.left = notchAt(k) + '%';
  $('track').appendChild(n);
}
board.addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) tap(+t.dataset.i); });
$('bUndo').onclick = undo;
$('bHint').onclick = hint;
$('bShuffle').onclick = shuffle;
$('bNew').onclick = askNew;
new ResizeObserver(fit).observe(wrap);
addEventListener('resize', fit);
setInterval(() => {
  if (!G || document.hidden || !sheet.hidden || !G.alive.some(Boolean)) return;
  G.elapsed++;
  $('sTime').textContent = fmt(G.elapsed);
  pace();
  if (G.elapsed % 5 === 0) save();
}, 1000);
addEventListener('pagehide', () => G && save());
document.addEventListener('visibilitychange', () => { if (document.hidden && G) save(); });

function start(data) {
  let stored = null;
  loadRec();
  try { stored = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  const s = data && data.state;
  if (s && s.rec && !Object.keys(REC).length) REC = s.rec;
  if (!restore(s) && !restore(stored)) newGame('keep');
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ state: serialize() })); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
